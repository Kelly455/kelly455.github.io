<!DOCTYPE html>
<html>
    <head>
        <title>My Travel Agency</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <h1>Welcom to my travel agency</h1>
        <section>
          <button id="myButton">Click Me</button>
          <input type="text" id="userInput" placeholder="Enter your name">
          <button id="submitButton">Submit</button>
          <p id="output"></p>
          <p id="dealResult"></p>
       </section>

       <section>
        <input id="ageInput" type="number" placeholder="Enter your age">
        <button id="ageButton">Check Age</button>
        <p id="ageResult"></p>
      </section>

       <section>
        <button class="pkgBtn" data-index="0">Beach Getaway</button>
        <button class="pkgBtn" data-index="1">Mountain Retreat</button>
        <button class="pkgBtn" data-index="2">City Tour</button>
        <p id="packageResult"></p>
      </section>
    


      <script src="script.js"></script>   
    </body>
</html>
